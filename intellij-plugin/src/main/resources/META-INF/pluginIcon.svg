<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="gitlane-bg" x1="2" y1="2" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="55%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="gitlane-ring" x1="2" y1="2" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- 2px transparent outer padding around 36x36 rounded badge -->
  <rect x="2" y="2" width="36" height="36" rx="8" fill="url(#gitlane-bg)" />
  <rect x="2.5" y="2.5" width="35" height="35" rx="7.5" stroke="url(#gitlane-ring)" stroke-width="1" />

  <!-- Master trunk (right, emerald) -->
  <path d="M27.5 10V30" stroke="#34D399" stroke-width="2.4" stroke-linecap="round" />

  <!-- Develop trunk (center, crisp white) -->
  <path d="M19.5 10V30" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" />

  <!-- Task branch (develop -> task -> develop, cyan) -->
  <path d="M19.5 12C15 12 12 14.5 12 18V22C12 25.5 15 28 19.5 28" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Release arrow/curve from develop to master -->
  <path d="M19.5 20H27.5" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" />

  <!-- Branch nodes -->
  <circle cx="19.5" cy="12" r="2.3" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.8" />
  <circle cx="12" cy="20" r="2.3" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8" />
  <circle cx="19.5" cy="28" r="2.3" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.8" />
  <circle cx="27.5" cy="20" r="2.5" fill="#34D399" stroke="#FFFFFF" stroke-width="1.4" />
  <circle cx="27.5" cy="11" r="2" fill="#34D399" />
</svg>
